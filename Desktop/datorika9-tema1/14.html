<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana Garāža</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

</style>

<body>
<h1>Mana Garāža</h1>
<h2>Kam spēle domāta?</h2>
<p>Spēle ir domāta cilvēkiem, kuriem patīk kosmoss.</p>
<h2>Mērķis</h2>
<p>Spēles mērķis ir savākt žurkas un iegūt punktus</p>
<h2>Noteikumi</h2>
<ul>
  <li>Spied uz žurkas, lai iegūtu punktu.</li>
  <li>Uzvara ir pie piecdesmit punktiem.</li>
</ul>
<h2>Spēla zaudēta</h2>
<p>Ja uzspiedīsi uz melnās žurkas, tad spēle būs zaudēta.</p>
<button>Sākt spēli</button>
</body>
</html>
